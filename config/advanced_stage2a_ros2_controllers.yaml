controller_manager:
  ros__parameters:
    # Match the teacher demo and upstream Gazebo effort-control loop. Stage 2A
    # releases one-shot YOLO load before navigation so Nav2 keeps CPU budget.
    update_rate: 1000
    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fr3_arm_controller:
  ros__parameters:
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.10
      fr3_joint1: {trajectory: 0.10, goal: 0.02}
      fr3_joint2: {trajectory: 0.10, goal: 0.02}
      fr3_joint3: {trajectory: 0.10, goal: 0.02}
      fr3_joint4: {trajectory: 0.10, goal: 0.02}
      fr3_joint5: {trajectory: 0.10, goal: 0.02}
      fr3_joint6: {trajectory: 0.10, goal: 0.02}
      fr3_joint7: {trajectory: 0.10, goal: 0.02}
    gains:
      fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint7: {p: 50.0, d: 0.3, i: 0.0, i_clamp: 1.0}
